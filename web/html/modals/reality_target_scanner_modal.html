{{define "modals/realityTargetScannerModal"}}
<a-modal id="reality-target-scanner-modal" v-model="realityScannerModal.visible" title="REALITY 目标查找与扫描 (H2 协商检测)"
  :width="850" :closable="true" :mask-closable="false" :class="themeSwitcher.currentTheme">
  <template slot="footer">
    <a-button @click="realityScannerModal.visible = false">{{ i18n "close" }}</a-button>
    <a-button type="dashed" :loading="realityScannerModal.loading" @click="realityScannerModal.scan()">重新扫描</a-button>
    <a-button type="primary" :disabled="realityScannerModal.results.length === 0" @click="realityScannerModal.autoPick()">自动优选</a-button>
  </template>

  <div style="margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;">
    <a-radio-group v-model="realityScannerModal.region" @change="realityScannerModal.onRegionChange" button-style="solid">
      <a-radio-button value="all">全部地区 (17)</a-radio-button>
      <a-radio-button value="us-west">美西节点 (12)</a-radio-button>
      <a-radio-button value="tokyo">东京节点 (5)</a-radio-button>
    </a-radio-group>
    <a-tag color="blue">自动过滤一级域名，仅保留具体主机名</a-tag>
  </div>

  <a-table :data-source="realityScannerModal.results" :loading="realityScannerModal.loading" :pagination="{ pageSize: 8 }"
    size="small" :row-key="record => record.target + (record.ip || '')">
    <a-table-column title="地区" key="region" width="80px">
      <template slot-scope="text, record">
        <a-tag :color="record.region === 'tokyo' ? 'purple' : 'blue'">
          [[ record.region === 'tokyo' ? '东京' : '美西' ]]
        </a-tag>
      </template>
    </a-table-column>

    <a-table-column title="目标 (Target)" data-index="target" key="target" width="180px">
      <template slot-scope="text, record">
        <b>[[ record.target ]]</b>
      </template>
    </a-table-column>

    <a-table-column title="H2 / ALPN" key="h2" width="100px">
      <template slot-scope="text, record">
        <a-tag v-if="record.h2" color="green">H2 支持</a-tag>
        <a-tag v-else color="red">[[ record.alpn || '无H2' ]]</a-tag>
      </template>
    </a-table-column>

    <a-table-column title="TLS" key="tls" width="80px">
      <template slot-scope="text, record">
        <a-tag v-if="record.tls13" color="cyan">TLS 1.3</a-tag>
        <a-tag v-else color="orange">[[ record.tlsVersion || '未知' ]]</a-tag>
      </template>
    </a-table-column>

    <a-table-column title="延迟" data-index="latencyMs" key="latencyMs" width="90px">
      <template slot-scope="text, record">
        <span v-if="record.latencyMs > 0" :style="{ color: record.latencyMs < 180 ? '#52c41a' : (record.latencyMs < 350 ? '#faad14' : '#f5222d'), fontWeight: 'bold' }">
          [[ record.latencyMs ]] ms
        </span>
        <span v-else>-</span>
      </template>
    </a-table-column>

    <a-table-column title="可用 SNI" key="serverNames" ellipsis>
      <template slot-scope="text, record">
        <span :title="(record.serverNames || []).join(', ')">
          [[ (record.serverNames || []).slice(0, 2).join(', ') ]]
        </span>
      </template>
    </a-table-column>

    <a-table-column title="操作" key="action" width="75px">
      <template slot-scope="text, record">
        <a-button type="primary" size="small" :disabled="!record.feasible" @click="realityScannerModal.useTarget(record)">
          选择
        </a-button>
      </template>
    </a-table-column>
  </a-table>
</a-modal>

<script>
const realityScannerModal = {
  visible: false,
  loading: false,
  region: 'all',
  results: [],
  show(region) {
    this.region = region || 'all';
    this.visible = true;
    this.scan();
  },
  onRegionChange() {
    this.scan();
  },
  async scan() {
    this.loading = true;
    this.results = [];
    try {
      const res = await HttpUtil.post('/panel/api/server/scanRealityTargets', { targets: this.region });
      if (res.success && Array.isArray(res.obj)) {
        this.results = res.obj;
      } else {
        app.$message.error(res.msg || '扫描目标失败');
      }
    } catch (e) {
      app.$message.error('扫描请求异常: ' + e);
    } finally {
      this.loading = false;
    }
  },
  useTarget(record) {
    if (!record) return;
    if (typeof inModal !== 'undefined' && inModal.inbound && inModal.inbound.stream && inModal.inbound.stream.reality) {
      inModal.inbound.stream.reality.target = record.target;
      inModal.inbound.stream.reality.serverNames = filterCleanSNIs(record.serverNames, record.target);
      inModal.realityScanResult = record;
      inModal.realityRegion = record.region || this.region;
    }
    this.visible = false;
    app.$message.success(`已应用目标: ${record.target} (延迟: ${record.latencyMs}ms, ALPN: ${record.alpn || 'h2'})`);
  },
  autoPick() {
    if (!this.results || this.results.length === 0) return;
    const best = this.results.find(c => c.feasible && c.h2 && c.tls13) ||
                 this.results.find(c => c.feasible) ||
                 this.results[0];
    if (best) {
      this.useTarget(best);
    }
  }
};
</script>
{{end}}
