services:
  3xui:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: 3xui_app
    ports:
      - "12053:2053"
      - "12096:2096"
      # Hysteria/Hysteria2 inbounds use UDP. Add one udp mapping per HY inbound port.
      # - "27612:27612/udp"
    # hostname: yourhostname <- optional
    volumes:
      - $PWD/db/:/etc/x-ui/
      - $PWD/cert/:/root/cert/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
    tty: true
    restart: unless-stopped
